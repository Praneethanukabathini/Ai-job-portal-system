<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | AI Job Portal</title>
  
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />
  <style>
    .auth-page-wrapper {
      min-height: calc(100vh - var(--header-height));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      background: radial-gradient(circle at 50% 30%, rgba(99, 102, 241, 0.08) 0%, transparent 65%);
    }
    .auth-box {
      width: 100%;
      max-width: 460px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 2.25rem;
      box-shadow: var(--shadow-xl);
    }
    .auth-role-tabs-bar {
      display: flex;
      background: var(--bg-subtle);
      padding: 0.3rem;
      border-radius: var(--radius-md);
      margin-bottom: 1.5rem;
      gap: 0.3rem;
    }
    .auth-role-tabs-bar button {
      flex: 1;
      padding: 0.5rem;
      border: none;
      background: transparent;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .auth-role-tabs-bar button.active {
      background: var(--bg-card);
      color: var(--primary-color);
      box-shadow: var(--shadow-sm);
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-brand">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <span>AI Job Portal<span class="brand-ai-badge">SECURE AUTH</span></span>
      </a>

      <nav>
        <ul class="nav-links">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="index.html#jobsSection" class="nav-link">Find Jobs</a></li>
          <li><a href="resume-builder.html" class="nav-link">Resume Builder</a></li>
          <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
        </ul>
      </nav>

      <div class="nav-right">
        <button id="themeToggleBtn" class="theme-toggle-btn" onclick="Theme.toggle()" title="Toggle Theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Login Main Container -->
  <div class="auth-page-wrapper">
    <div class="auth-box">
      <div class="text-center mb-4">
        <h2 id="loginTitle" style="font-size: 1.6rem; margin-bottom: 0.35rem;">Sign In to Portal</h2>
        <p class="text-xs text-muted" id="loginSubtitle">Access your AI matching recommendations and application pipeline.</p>
      </div>

      <!-- Role Selection Tabs -->
      <div class="auth-role-tabs-bar">
        <button type="button" id="tabCandidate" class="active" onclick="switchLoginRole('candidate')">
          👤 Candidate / Job Seeker
        </button>
        <button type="button" id="tabRecruiter" onclick="switchLoginRole('recruiter')">
          🏢 Recruiter / Employer
        </button>
      </div>

      <!-- Quick Demo Login Banner -->
      <div class="demo-login-box mb-4">
        <div class="demo-box-header">
          <span class="badge badge-accent">Demo Access (Password: 12345)</span>
          <span class="text-xs text-muted">1-Click Fast Sign In</span>
        </div>
        <div class="demo-box-buttons">
          <button type="button" class="btn btn-outline btn-xs" onclick="quickFillDemo('candidate')">
            ⚡ Login Candidate (Rahul)
          </button>
          <button type="button" class="btn btn-outline btn-xs" onclick="quickFillDemo('recruiter')">
            ⚡ Login Recruiter (Priya)
          </button>
        </div>
      </div>

      <!-- Login Form -->
      <form id="standaloneLoginForm" onsubmit="handleStandaloneLogin(event)">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" class="form-input" value="rahul.sharma@example.com" required />
        </div>

        <div class="form-group">
          <div class="flex-between">
            <label class="form-label" for="loginPassword">Password</label>
            <span class="text-xs text-primary font-semibold">Default: 12345</span>
          </div>
          <input type="password" id="loginPassword" class="form-input" value="12345" required />
        </div>

        <div id="loginErrorMsg" class="auth-error-msg" style="display:none;"></div>

        <button type="submit" id="loginSubmitBtn" class="btn btn-primary btn-block btn-lg mt-3">
          Sign In as Candidate
        </button>
      </form>

      <div class="text-center mt-4 text-xs text-muted">
        Need a new account? <a href="index.html" class="text-primary font-bold">Register on Homepage</a> • <a href="index.html" class="text-muted">Return to Home</a>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script>
    let currentRole = 'candidate';

    function switchLoginRole(role) {
      currentRole = role;
      const tabC = document.getElementById('tabCandidate');
      const tabR = document.getElementById('tabRecruiter');
      const btn = document.getElementById('loginSubmitBtn');
      const emailInput = document.getElementById('loginEmail');
      const title = document.getElementById('loginTitle');

      if (role === 'candidate') {
        tabC.classList.add('active');
        tabR.classList.remove('active');
        btn.textContent = 'Sign In as Candidate';
        emailInput.value = 'rahul.sharma@example.com';
        title.textContent = 'Candidate Sign In';
      } else {
        tabR.classList.add('active');
        tabC.classList.remove('active');
        btn.textContent = 'Sign In as Recruiter';
        emailInput.value = 'priya.hr@techcorp.in';
        title.textContent = 'Recruiter Sign In';
      }
    }

    function quickFillDemo(role) {
      switchLoginRole(role);
      document.getElementById('loginPassword').value = '12345';
      const email = role === 'candidate' ? 'rahul.sharma@example.com' : 'priya.hr@techcorp.in';
      const res = Auth.login(email, '12345', role);
      if (res.success) {
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 500);
      }
    }

    function handleStandaloneLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const errorBox = document.getElementById('loginErrorMsg');
      errorBox.style.display = 'none';

      const res = Auth.login(email, password, currentRole);
      if (res.success) {
        window.location.href = 'dashboard.html';
      } else {
        errorBox.textContent = res.message;
        errorBox.style.display = 'block';
      }
    }
  </script>
</body>
</html>
