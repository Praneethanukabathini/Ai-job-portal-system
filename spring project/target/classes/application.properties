# ==========================================
# AI Job Portal - Spring Boot Configuration
# ==========================================

server.port=8080

# Spring Application Name
spring.application.name=AI-Job-Portal

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Static Resources
spring.web.resources.static-locations=classpath:/static/,file:./

# In-Memory H2 Database Configuration (Zero Configuration Setup)
spring.datasource.url=jdbc:h2:mem:jobportal_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=12345
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# SQL Initialization (Runs database.sql on startup)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:database.sql
