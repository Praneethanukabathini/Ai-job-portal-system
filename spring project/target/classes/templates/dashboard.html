<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | AI Job Portal</title>
  
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-brand">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <span>AI Job Portal<span class="brand-ai-badge">DASHBOARD</span></span>
      </a>

      <nav>
        <ul class="nav-links">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="index.html#jobsSection" class="nav-link">Find Jobs</a></li>
          <li><a href="resume-builder.html" class="nav-link">Resume Builder</a></li>
          <li><a href="dashboard.html" class="nav-link active">Dashboard</a></li>
        </ul>
      </nav>

      <div class="nav-right">
        <!-- Theme Toggle -->
        <button id="themeToggleBtn" class="theme-toggle-btn" onclick="Theme.toggle()" title="Toggle Theme" aria-label="Toggle Dark/Light Mode">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>

        <div id="navAuthActions" class="nav-auth-actions"></div>
      </div>
    </div>
  </header>

  <!-- Dashboard Container -->
  <main class="dashboard-page">
    <div class="container">
      
      <!-- User Profile Header & Role Switcher Banner -->
      <section class="dashboard-header-card" id="dashboardHeaderProfile"></section>

      <!-- 2-Column Dashboard Grid: Sidebar & Main Content -->
      <div class="dashboard-grid">
        <!-- Dashboard Sidebar Navigation -->
        <aside class="dashboard-sidebar" id="dashboardSidebar">
          <nav id="dashboardSidebarNav"></nav>
        </aside>

        <!-- Main Dynamic Dashboard Content Area -->
        <section class="dashboard-main" id="dashboardMainContent"></section>
      </div>

    </div>
  </main>

  <!-- Auth Modal (if user logs out or switches) -->
  <div id="authModal" class="modal-overlay">
    <div class="modal-container" id="authModalContent"></div>
  </div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
